<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 3 - Presupuesto de Capital</title>
<style>
:root{--bg:#f5efe8;--card:#fffdf9;--ink:#342d29;--muted:#786e66;--rose:#b77f72;--green:#637b68;--line:#e8dbd0}*{box-sizing:border-box}body{margin:0;background:#e5ddd4;color:var(--ink);font:15px "Segoe UI",Arial,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:16px}.slide{width:min(1180px,96vw);min-height:680px;background:var(--bg);border-radius:22px;box-shadow:0 20px 55px #51403322;padding:40px 55px;display:flex;flex-direction:column;position:relative;overflow:hidden}.header,.footer{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:13px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.footer{border:0;border-top:1px solid var(--line);padding-top:13px;padding-bottom:0;text-transform:none;letter-spacing:normal}.brand{font-weight:800;color:var(--rose)}.content{flex:1;display:flex;flex-direction:column;justify-content:center}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(38px,4vw,60px);line-height:1.04;margin:14px 0}h2{font-size:32px;margin:8px 0 16px}h3{font-size:18px;margin:0 0 8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--rose);font-weight:800}p{color:var(--muted);line-height:1.55}.cover{display:grid;grid-template-columns:1.2fr .8fr;gap:35px;align-items:center}.dark{background:var(--ink);color:white;padding:28px;border-radius:18px}.dark p{color:#e9dcd2}.members{font-size:13px;line-height:1.8}.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:8px 13px;font-size:11px;color:var(--muted)}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cols.two{grid-template-columns:1fr 1fr}.tile,.alt{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:15px}.tile p,.alt p{font-size:13px;margin:6px 0 0}.big{font:30px Georgia;color:var(--rose);margin-bottom:6px}.list{display:grid;gap:10px}.list div{background:var(--card);padding:12px 15px;border:1px solid var(--line);border-radius:12px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden}td,th{padding:10px 13px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}th{background:#eadbd0}.total td{font-weight:bold;border-top:2px solid var(--rose)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.metric{background:#eee4da;border-radius:12px;padding:13px}.metric strong{display:block;font:24px Georgia;color:var(--rose)}.metric small{font-size:10px;color:var(--muted)}.chart{display:flex;gap:12px;height:140px;align-items:end;margin:10px 0}.baritem{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px}.bar{width:68%;max-width:68px;background:linear-gradient(#d7b3a3,#b77f72);border-radius:8px 8px 2px 2px;animation:rise .8s ease-out;transform-origin:bottom}.baritem b{font-size:11px}.baritem small{font-size:10px;color:var(--muted)}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}button{border:0;border-radius:30px;background:var(--ink);color:white;padding:9px 14px;cursor:pointer;font-size:12px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.nav{display:flex;align-items:center;gap:8px}.counter{font-size:11px;color:var(--muted)}@media(max-width:800px){.slide{padding:25px 20px;min-height:90vh}.cover,.cols,.cols.two,.compare{grid-template-columns:1fr}.footer{gap:12px;align-items:flex-start;flex-direction:column}}@media print{body{background:white}.shell{padding:0;display:block}.slide{width:100%;min-height:100vh;border-radius:0;box-shadow:none;page-break-after:always}}

.illustration{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.visual-row{display:grid;grid-template-columns:1fr 230px;gap:22px;align-items:center}
.visual-card{background:#f0e5dc;border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .mini-icon{width:44px;height:44px;margin-bottom:8px}
@media(max-width:800px){.visual-row{grid-template-columns:1fr}.illustration{max-width:230px}}

/* Ilustración temática decorativa en la franja inferior rosada de cada diapositiva */
.slide{isolation:isolate}
.slide::after{content:"";position:absolute;left:0;right:0;bottom:0;height:142px;
  background:linear-gradient(0deg,rgba(215,179,163,.32),rgba(215,179,163,0));
  pointer-events:none;z-index:0}
.topic-watermark{position:absolute;right:34px;bottom:47px;width:190px;height:135px;
  display:grid;place-items:center;opacity:.22;pointer-events:none;z-index:0;
  color:#a9675d;filter:saturate(.75)}
.topic-watermark svg{width:100%;height:100%;overflow:visible}
.slide .header,.slide .content,.slide .footer{position:relative;z-index:1}
@media(max-width:800px){.topic-watermark{width:112px;height:85px;right:14px;bottom:58px;opacity:.15}}
@media print{.topic-watermark{opacity:.25}}
